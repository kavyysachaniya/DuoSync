<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>
    <linearGradient id="ringRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C8A" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="ringSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Icon Background with subtle soft border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- Two Interlocking Luminous Partner Rings (DuoSync) -->
  <!-- Left Ring: Rose / Partner 1 -->
  <circle cx="216" cy="256" r="96" fill="none" stroke="url(#ringRose)" stroke-width="28" stroke-linecap="round" opacity="0.95" filter="url(#glow)" />
  
  <!-- Right Ring: Sky Blue / Partner 2 -->
  <circle cx="296" cy="256" r="96" fill="none" stroke="url(#ringSky)" stroke-width="28" stroke-linecap="round" opacity="0.95" filter="url(#glow)" />

  <!-- Center Intersecting Overlap Dot / Sync Spark -->
  <circle cx="256" cy="256" r="16" fill="#FFFFFF" filter="url(#glow)" />
</svg>
